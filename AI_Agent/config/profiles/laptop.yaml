# Laptop dev box (the brain for now): native Ubuntu 24.04, RTX 5070 Laptop 8 GB
# (Blackwell, needs torch cu128+), 62 GB RAM. Default profile.
name: laptop
device: cuda
llm:
  backend: ollama
  model: qwen3.5:9b        # fits fully in 8 GB VRAM, ~43 tok/s measured
  small_model: null        # no downgrade on dev machines; smaller models are Jetson-only
  num_ctx: 8192
  temperature: 0.3
  think: false             # thinking mode off: lower latency for voice
  keep_alive: 30m
  timeout_s: 120
  max_tool_rounds: 4
telemetry:
  enabled: true
  log_text: false          # don't store user text unless explicitly enabled
server:
  host: 127.0.0.1          # v0 has no auth: loopback only
  port: 8765
  allowed_origins: []      # extra browser origins allowed besides the server's own
