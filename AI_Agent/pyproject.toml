[project]
name = "sasha"
version = "0.0.1"
description = "A fully local, renamable, Marathi + English voice assistant."
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
]

[project.scripts]
sasha = "sasha.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sasha"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
