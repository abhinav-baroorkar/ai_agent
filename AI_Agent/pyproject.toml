[project]
name = "sasha"
version = "0.0.1"
description = "A fully local, renamable, Marathi + English voice assistant."
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
# Real speech models. `uv sync --extra voice`. CI and text-only work stay light without it.
voice = [
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.6.1",  # the version the stage was written and tested against
    "huggingface-hub>=0.24",
    "numpy>=1.26",
]
# Optional CUDA 12 libraries for faster-whisper on an NVIDIA GPU (x86-64 Linux).
# NVIDIA's own licence (proprietary, redistributable); never needed for CPU.
voice-gpu = [
    "nvidia-cublas-cu12>=12.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
listener = ["jeepney>=0.8"]

[project.scripts]
sasha = "sasha.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sasha"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pynvml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional `voice` extra: absent in CI, so mypy must not require it.
module = [
    "faster_whisper", "faster_whisper.*", "kokoro_onnx", "onnxruntime",
    "huggingface_hub", "huggingface_hub.*", "numpy", "numpy.*",
    "jeepney", "jeepney.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
